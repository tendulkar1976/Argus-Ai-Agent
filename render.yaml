databases:
  - name: argus-db
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: argus-ai-studio
    runtime: docker
    branch: render-free
    plan: free
    region: singapore
    dockerCommand: python -m argus.render_start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: argus-db
          property: connectionString
      - key: ARGUS_ENCRYPTION_SECRET
        generateValue: true
      - key: ARGUS_OWNER_KEY
        generateValue: true
